recipe_version: "2"
model: Hcompany/Holo-3.1-35B-A3B-FP8
runtime: atlas
container: atlas-gb10:b12x-ready
max_nodes: 1

metadata:
  description: |
    Holo-3.1-35B-A3B (H Company FP8 checkpoint) on a single GB10 (sm_121).
    This is the BLOCK-SCALED FP8 sibling of holo-3.1-35b-a3b-nvfp4.yaml.
    Prefer the NVFP4 recipe for max speed; use THIS when you specifically
    need the FP8 checkpoint. Live-validated 2026-07-11 on gx10 against a tip
    Atlas build (main #298) in atlas-gb10:b12x-ready.

    Checkpoint: compressed-tensors, format "float-quantized", weights
    strategy "block" → 2D block scale weight_scale [N/128, K/128] (e.g.
    gate_proj [512,2048] fp8 + [4,16] bf16). qwen3_5_moe arch + vision, NO
    mtp. Atlas loads it NATIVE: Weight format Fp8BlockScaled, "MoE experts
    loaded as native FP8" (fused batch1/2/3), resolves to the holo3_1_moe
    path → kernel target holo-3.1-35b-a3b. quant compat kernel=nvfp4
    model=fp8 OK.

    ==================================================================
    ⚠️ CRITICAL: DO NOT SET ATLAS_FP8_SINGLE_SCALE=1 ON THIS MODEL
    ==================================================================
    ATLAS_FP8_SINGLE_SCALE=1 is a DIAGNOSTIC fallback that DISABLES
    block-scaled FP8 prefill and reverts to the old single-scale path
    (fp8_blockscaled_prefill_enabled() == !(FP8_SINGLE_SCALE==1)). On a
    BLOCK-scaled checkpoint that collapses the per-128-block weight_scale
    into one scalar → B1 drift gauge ~1400 vs ~100 (≈14×). Symptom is
    subtle: short-prompt coherence still looks fine (17+26=43), but under
    long agentic tasks the model DRIFTS FILE WRITE PATHS — project files
    land off the target root, no valid Cargo.toml, and the opencode
    webserver_ok harness scores 0/N (write_path_drift_from_target > 0).
    Measured: with the flag ON, Holo-3.1-FP8 scored 0/2 webserver_ok with
    write_path_drift=2; with it OFF, write_path_drift=0 on every run and
    runs pass (webserver_ok + followed_directions, ~170-200s each). The
    NVFP4 sibling is unaffected by the flag (no block-scaled FP8 weights),
    which is why it appears in the NVFP4 fast stack — but it MUST be
    dropped here. Same rule for any block-scaled FP8 model (Qwen native
    FP8, compressed-tensors strategy:block).

    ==================================================================
    MEASURED (2026-07-11, gx10)
    ==================================================================
      coherence: PASS ("17 + 26 equals 43", finish=stop)
      decode:    ~73 tok/s
      agentic (opencode webserver_ok, corrected config): write_path_drift=0
                across all runs; passing runs complete ~170-200s. Remaining
                fails were the agent not converging on the axum dependency
                puzzle within the 360s harness cap — task difficulty, not
                serving.

    ==================================================================
    BUILD — INSIDE atlas-gb10:b12x-ready, kernel target holo-3.1-35b-a3b
    ==================================================================
      docker run --rm -v <repo>:/atlas -w /atlas atlas-gb10:b12x-ready \
        bash -c 'ATLAS_TARGET_HW=gb10 \
          ATLAS_TARGET_MODEL=holo-3.1-35b-a3b \
          ATLAS_TARGET_QUANT=nvfp4 \
          cargo build --release -p spark-server \
            --no-default-features --features cuda'
    (nvfp4 kernel bundle serves this fp8 checkpoint via the native
    block-scaled FP8 path; kernel=nvfp4 model=fp8 is the expected compat.)
    Binary: target/release/spark. A unified ATLAS_TARGET_MODEL='*' build
    also works (one binary serves Holo + Qwen3.6 + Ornith).

    ==================================================================
    FULL PROVEN ENV — the holo NVFP4 fast stack MINUS ATLAS_FP8_SINGLE_SCALE
    ==================================================================
      ATLAS_TARGET_HW=gb10   HF_HUB_OFFLINE=1   RUST_LOG=info
      ATLAS_HOLO_LOW_MEMORY_MOE=1
      ATLAS_HOLO_FAST_MOE_MODE=full
      ATLAS_HOLO_FAST_MOE_LAYERS=0-39
      ATLAS_HOLO_MOE_GROUPED_CUTLASS=1
      ATLAS_HOLO_MOE_GROUPED_DOWN=1
      ATLAS_MOE_PREFILL_EXACT_TILES=1
      ATLAS_HOLO_NATIVE_FP8_ATTN=1
      ATLAS_HOLO_NATIVE_FP8_SSM=1
      ATLAS_HOLO_FP4_PROJ_DECODE=1
      ATLAS_GDN_TC_VBLOCK=0
      ATLAS_GDN_FLASHINFER=1     # short-ctx; =0 at >=128K (long-ctx correctness)
      ATLAS_FLASHINFER_PREFILL=1
      ATLAS_CUBLAS_GEMM=1
      ATLAS_CUTLASS_WORKSPACE_MB=512
      ATLAS_KV_OVERCOMMIT=1
      ATLAS_SSM_BATCHED_RECURRENT=1
      ATLAS_GDN_LIB=/atlas/3rdparty_patches/gdn_aot/libatlasgdn.so
      CUTE_DSL_ARCH=sm_121a
      ATLAS_PREFILL_VARLEN=1
      ATLAS_PREFILL_CODISPATCH=1
      ATLAS_PREFILL_CODISPATCH_WINDOW_MS=100
      ATLAS_Q12_BATCHED=1
      ATLAS_Q12_BATCHED_FIRST_CHUNK=1
      ATLAS_MAX_BATCH_TOKENS=16384
      ATLAS_DECODE_GRAPHS_MULTISEQ=1
      # NOTE: ATLAS_FP8_SINGLE_SCALE is DELIBERATELY ABSENT (see warning above).

    ==================================================================
    RUN
    ==================================================================
    docker run -d --name holofp8 --gpus all --ipc=host \
      -v <repo>:/atlas -v /tank:/tank:ro \
      -e HF_HUB_CACHE=/tank/hf/hub \
      -e ATLAS_TARGET_HW=gb10 -e HF_HUB_OFFLINE=1 -e RUST_LOG=info \
      -e ATLAS_HOLO_LOW_MEMORY_MOE=1 -e ATLAS_HOLO_FAST_MOE_MODE=full \
      -e ATLAS_HOLO_FAST_MOE_LAYERS=0-39 \
      -e ATLAS_HOLO_MOE_GROUPED_CUTLASS=1 -e ATLAS_HOLO_MOE_GROUPED_DOWN=1 \
      -e ATLAS_MOE_PREFILL_EXACT_TILES=1 \
      -e ATLAS_HOLO_NATIVE_FP8_ATTN=1 -e ATLAS_HOLO_NATIVE_FP8_SSM=1 \
      -e ATLAS_HOLO_FP4_PROJ_DECODE=1 \
      -e ATLAS_GDN_TC_VBLOCK=0 -e ATLAS_GDN_FLASHINFER=1 \
      -e ATLAS_FLASHINFER_PREFILL=1 -e ATLAS_CUBLAS_GEMM=1 \
      -e ATLAS_CUTLASS_WORKSPACE_MB=512 -e ATLAS_KV_OVERCOMMIT=1 \
      -e ATLAS_SSM_BATCHED_RECURRENT=1 \
      -e ATLAS_GDN_LIB=/atlas/3rdparty_patches/gdn_aot/libatlasgdn.so \
      -e CUTE_DSL_ARCH=sm_121a \
      -e ATLAS_PREFILL_VARLEN=1 -e ATLAS_PREFILL_CODISPATCH=1 \
      -e ATLAS_PREFILL_CODISPATCH_WINDOW_MS=100 \
      -e ATLAS_Q12_BATCHED=1 -e ATLAS_Q12_BATCHED_FIRST_CHUNK=1 \
      -e ATLAS_MAX_BATCH_TOKENS=16384 -e ATLAS_DECODE_GRAPHS_MULTISEQ=1 \
      -p 8888:8888 atlas-gb10:b12x-ready \
      /atlas/target/release/spark serve "Hcompany/Holo-3.1-35B-A3B-FP8" \
        --port 8888 --bind 0.0.0.0 \
        --kv-cache-dtype bf16 --kv-high-precision-layers auto \
        --gpu-memory-utilization 0.7 \
        --max-seq-len 262144 --max-num-seqs 16 --max-batch-size 16 \
        --max-prefill-tokens 16384 --scheduling-policy slai \
        --enable-prefix-caching true \
        --ssm-cache-slots 128 --ssm-checkpoint-interval 16

    lm-head: leave default (do NOT pass --lm-head-dtype). Speculative: none
    (no mtp head in this checkpoint). Vision checkpoint (image_token
    present); text-only serving unaffected.
  maintainer: monumental
  category: agent
  model_params: 35B
  model_dtype: fp8
  quantization: compressed-tensors-fp8-block
  kv_dtype: bf16

defaults:
  port: 8888
  host: 0.0.0.0
  max_model_len: 262144
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.7
  max_num_seqs: 16
  max_batch_size: 16
  max_prefill_tokens: 16384
  scheduling_policy: slai
  ssm_cache_slots: 128
  ssm_checkpoint_interval: 16
  enable_prefix_caching: true
# ENV: full ATLAS_* prefill stack MANDATORY — but ATLAS_FP8_SINGLE_SCALE must
# be ABSENT (=1 disables block-scaled prefill on this block-scaled FP8
# checkpoint → 14x drift → agentic write-path drift). Build the
# holo-3.1-35b-a3b target INSIDE atlas-gb10:b12x-ready.
