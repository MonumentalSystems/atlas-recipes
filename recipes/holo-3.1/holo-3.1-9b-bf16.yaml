recipe_version: "2"
model: Hcompany/Holo-3.1-9B
runtime: atlas
container: atlas-gb10:b12x-ready
max_nodes: 1

metadata:
  description: |
    Holo-3.1-9B (qwen3_5 DENSE architecture, hidden_size 4096) — the small
    dense sibling of the Holo-3.1 family, tuned for fast prefill at a 256K
    long-context window on a single GB10 (sm_121). Shares the exact prefill-
    accelerator env stack proven on the 35B-A3B recipe (2026-07-11 on gx10),
    MINUS the Holo MoE flags (9B is dense — no MoE path).

    KERNEL TARGET: ornith-1.0-9b. There is NO holo-3.1-9b kernel directory;
    Holo-3.1-9B is a dense qwen3_5 (hidden_size 4096) served by the
    ornith-1.0-9b dense kernel target. The upstream checkpoint is bf16
    (unquantized) and loads through the nvfp4<->bf16 compat pair.

    256K: Holo-3.1-9B's config reports max_position_embeddings 262144, so
    the full 256K window fits — max_model_len 262144 needs NO cap. bf16 KV
    is used for the same reason as the 35B: ~1.4-2x faster prefill and
    coherent at depth (fp8/nvfp4 KV degrade long-context). ATLAS_KV_OVERCOMMIT=1
    is REQUIRED at 256K (on-demand paged KV allocation).

    ======================================================================
    BUILD — CRITICAL: build INSIDE atlas-gb10:b12x-ready, NOT bare host
    ======================================================================
    The spark binary MUST be compiled inside the CUDA-13.2 CUTLASS/
    FlashInfer container atlas-gb10:b12x-ready. That image sets
    CUTLASS_HOME=/opt/cutlass, FLASHINFER_HOME=/opt/flashinfer, and
    CUTE_DSL_ARCH=sm_121a. spark-runtime/build.rs gates the CUTLASS kernels
    and the atlas_cutlass cfg on CUTLASS_HOME being set — a bare-host
    `cargo build` SILENTLY omits them and prefill collapses to ~500 tok/s
    with no error.

    Build command (kernel target for this model: ornith-1.0-9b):
      docker run --rm -v <repo>:/atlas -w /atlas atlas-gb10:b12x-ready \
        bash -c 'ATLAS_TARGET_HW=gb10 \
          ATLAS_TARGET_MODEL=ornith-1.0-9b \
          ATLAS_TARGET_QUANT=nvfp4 \
          cargo build --release -p spark-server \
            --no-default-features --features cuda'
    --no-default-features --features cuda drops the (default-on) nccl
    feature (multi-GPU only). Binary: target/release/spark.

    ======================================================================
    FULL PROVEN ENV — dense 9B: the generic prefill accelerators + GDN/SSM
    + KV/GEMM flags (the Holo MoE flags are DROPPED — no MoE path). Set
    every -e on the container. Dropping any one silently HALVES prefill.
    ======================================================================
      ATLAS_TARGET_HW=gb10   HF_HUB_OFFLINE=1   RUST_LOG=info

      # --- GDN/SSM + GEMM (SSM_BATCHED_RECURRENT and FLASHINFER_PREFILL
      #     are the two biggest single wins) ---
      ATLAS_GDN_TC_VBLOCK=0
      ATLAS_GDN_FLASHINFER=1
      ATLAS_FLASHINFER_PREFILL=1
      ATLAS_CUBLAS_GEMM=1
      ATLAS_CUTLASS_WORKSPACE_MB=512
      ATLAS_KV_OVERCOMMIT=1
      ATLAS_SSM_BATCHED_RECURRENT=1
      ATLAS_GDN_LIB=/atlas/3rdparty_patches/gdn_aot/libatlasgdn.so
      CUTE_DSL_ARCH=sm_121a

      # --- Prefill accelerators (model-agnostic) ---
      ATLAS_PREFILL_VARLEN=1
      ATLAS_PREFILL_CODISPATCH=1
      ATLAS_PREFILL_CODISPATCH_WINDOW_MS=100
      ATLAS_Q12_BATCHED=1
      ATLAS_Q12_BATCHED_FIRST_CHUNK=1
      ATLAS_MAX_BATCH_TOKENS=16384
      ATLAS_DECODE_GRAPHS_MULTISEQ=1
      ATLAS_FP8_SINGLE_SCALE=1

    ======================================================================
    RUN
    ======================================================================
    docker run -d --name holo9b --gpus all --ipc=host \
      -v <repo>:/atlas -v /tank:/tank:ro \
      -e HF_HUB_CACHE=/tank/hf/hub \
      -e ATLAS_TARGET_HW=gb10 -e HF_HUB_OFFLINE=1 -e RUST_LOG=info \
      -e ATLAS_GDN_TC_VBLOCK=0 -e ATLAS_GDN_FLASHINFER=1 \
      -e ATLAS_FLASHINFER_PREFILL=1 -e ATLAS_CUBLAS_GEMM=1 \
      -e ATLAS_CUTLASS_WORKSPACE_MB=512 -e ATLAS_KV_OVERCOMMIT=1 \
      -e ATLAS_SSM_BATCHED_RECURRENT=1 \
      -e ATLAS_GDN_LIB=/atlas/3rdparty_patches/gdn_aot/libatlasgdn.so \
      -e CUTE_DSL_ARCH=sm_121a \
      -e ATLAS_PREFILL_VARLEN=1 -e ATLAS_PREFILL_CODISPATCH=1 \
      -e ATLAS_PREFILL_CODISPATCH_WINDOW_MS=100 \
      -e ATLAS_Q12_BATCHED=1 -e ATLAS_Q12_BATCHED_FIRST_CHUNK=1 \
      -e ATLAS_MAX_BATCH_TOKENS=16384 -e ATLAS_DECODE_GRAPHS_MULTISEQ=1 \
      -e ATLAS_FP8_SINGLE_SCALE=1 \
      -p 8888:8888 atlas-gb10:b12x-ready \
      /atlas/target/release/spark serve "Hcompany/Holo-3.1-9B" \
        --port 8888 --bind 0.0.0.0 \
        --kv-cache-dtype bf16 --gpu-memory-utilization 0.7 \
        --max-seq-len 262144 --max-num-seqs 16 --max-batch-size 16 \
        --max-prefill-tokens 16384 --scheduling-policy slai \
        --enable-prefix-caching true

    Dense model: no --ssm-cache-slots / --ssm-checkpoint-interval (no SSM
    snapshot slots to tune). --target-kv-tokens and --vision-max-pixels
    exist on NEWER binaries only — OMIT if the binary rejects them. Do NOT
    pass --lm-head-dtype.
  maintainer: monumental
  category: agent
  model_params: 9B
  model_dtype: bf16
  quantization: none
  kv_dtype: bf16

defaults:
  port: 8888
  host: 0.0.0.0
  # 256K window. Holo-3.1-9B config max_position_embeddings=262144, so no
  # cap is needed — 262144 is the model's real ceiling.
  max_model_len: 262144
  kv_cache_dtype: bf16
  # 0.7 co-tenant-safe default; dense 9B leaves plenty of headroom next to
  # a 256K bf16 KV pool — raise on a dedicated box.
  gpu_memory_utilization: 0.7
  max_num_seqs: 16
  max_batch_size: 16
  max_prefill_tokens: 16384
  scheduling_policy: slai
  enable_prefix_caching: true
# ENV: the generic prefill accelerator + GDN/SSM + KV/GEMM stack is
# MANDATORY (no declarative slot in recipe_version 2) — set every -e on the
# container, see the BUILD/RUN blocks above. Dropping any one silently
# halves prefill. Build INSIDE atlas-gb10:b12x-ready or build.rs omits the
# CUTLASS kernels. Dense model: no ssm_cache_slots (no SSM snapshot slots).
